# Project identification
sonar.projectKey=phluesky
sonar.organization=potibm

# Source vs test layout
# - sonar.sources: production code, quality rules apply
# - sonar.tests: test code, metrics/coverage only, no quality rules
sonar.sources=src
sonar.tests=tests

# Test reporting
sonar.php.coverage.reportPaths=coverage.xml

# Source encoding
sonar.sourceEncoding=UTF-8
