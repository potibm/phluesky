name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  run:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
        minimum_versions: [false]
        coverage: ['none']
        include:
          - description: 'Minimum version'
            php: '8.2'
            minimum_versions: true
          - description: 'Log Code Coverage'
            php: '8.2'
            coverage: 'xdebug'
          - php: '8.6'
            experimental: true

    name: PHP ${{ matrix.php }} ${{ matrix.description }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: ${{ matrix.php }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage }}

      - name: Install dependencies
        run: composer install
        if: matrix.minimum_versions == false
        continue-on-error: ${{ matrix.experimental == true }}

      # composer.lock is gitignored (library convention); --prefer-lowest intentionally
      # resolves the lowest allowed dependency bounds, so versions are not lock-pinned here.
      - name: Install dependencies lower
        run: composer update --no-interaction --prefer-lowest # NOSONAR
        if: matrix.minimum_versions == true
        continue-on-error: ${{ matrix.experimental == true }}

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit
        if: matrix.coverage == 'none'
        continue-on-error: ${{ matrix.experimental == true }}

      - name: PHPUnit tests and Log Code coverage
        run: ./vendor/bin/phpunit --exclude-group proxy --coverage-clover=coverage.xml
        if: matrix.coverage == 'xdebug'
        continue-on-error: ${{ matrix.experimental == true }}

      - name: Run codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.coverage == 'xdebug'
        continue-on-error: ${{ matrix.experimental == true }}
        with:
          files: './coverage.xml'
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
